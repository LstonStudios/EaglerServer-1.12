plugins {
    id 'java'
}

group = 'net.lstonstudios'
version = '1.0.4-velocity.1'

tasks.withType(JavaCompile).configureEach {
    options.release.set(17)
}

dependencies {
    compileOnly files(
            '../bungee/bungee.jar',
            '../bungee/plugins/EaglerXServer.jar',
            '../bungee/plugins/EaglercraftX_1.8_EaglerXVelocity.jar'
    )
}

jar {
    archiveBaseName = 'EaglerMOTD-Velocity'
}