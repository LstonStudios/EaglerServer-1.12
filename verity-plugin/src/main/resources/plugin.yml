name: Verity
version: 1.0.0
main: net.lstonstudios.verity.VerityPlugin
author: LstonStudios
description: The viral Verity mod - a helpful AI friend that slowly turns sinister.
commands:
  verity:
    description: Get a Verity Box, or remove your Verity.
    usage: |
      /verity                       - give yourself a Verity Box
      /verity kill                  - kill your Verity
      /verity phase <player> <1-4>  - set a player's Verity phase (admins)
      /verity <targets> [amount]    - give Verity Boxes to others (admins; @a, @s, @p, @r or names)
      /verity killall               - kill every Verity (admins)
  verityhelp:
    description: List the Verity commands.
    usage: /verityhelp
  verityphase:
    description: Set every Verity to a phase (admins).
    usage: /verityphase <1-4>
permissions:
  verity.admin:
    description: Allows /verity <targets>, /verity killall and /verityphase.
    default: op
