# Five shop menus: /cshop 1 ... /cshop 5, or a block set with /cshop <n> setblock.
# Rename a menu in game with /cshop <n> rename <name>.
# Each category gets its own header row, then its items below it,
# sorted from weakest/cheapest to strongest/most expensive.
# An item with a "command" runs it as console when bought (%player% = buyer);
# otherwise the item itself is given. "name", "description" and "glow: true" are optional.
# Admins edit shops in game (open /cshop <n>); layouts are saved here as slots after the first load.
shops:
  "1":
    title: "Shop"
    categories:
      - name: "&c&lAbilities"
        items:
          - {material: MONSTER_EGG, name: "&fGale Force", description: "Launches you 10 blocks up, no fall damage.", price: 400, glow: true, command: "customability %player% gale 1"}
          - {material: MONSTER_EGG, name: "&dQuantum Shift", description: "Teleports you 6 blocks forward.", price: 500, glow: true, command: "customability %player% quantum 1"}
          - {material: MONSTER_EGG, name: "&aTailwind", description: "Speed II for you and nearby teammates.", price: 600, glow: true, command: "customability %player% tailwind 1"}
          - {material: MONSTER_EGG, name: "&6Overclock", description: "Speed III and Haste II for 10s.", price: 700, glow: true, command: "customability %player% overclock 1"}
          - {material: MONSTER_EGG, name: "&bSonic Boom", description: "Knocks back everything within 4 blocks.", price: 800, glow: true, command: "customability %player% sonic 1"}
          - {material: MONSTER_EGG, name: "&7Chitinous Shield", description: "Resistance III and Slowness I for 5s.", price: 900, glow: true, command: "customability %player% chitinous 1"}
          - {material: MONSTER_EGG, name: "&eAegis Burst", description: "Clears bad effects, grants absorption.", price: 1000, glow: true, command: "customability %player% aegis 1"}
          - {material: MONSTER_EGG, name: "&8Shadow Step", description: "Invisible for 4s with gear hidden.", price: 1100, glow: true, command: "customability %player% shadow 1"}
          - {material: MONSTER_EGG, name: "&cPyroclastic Smash", description: "Fire wave: 3 hearts of damage and burning.", price: 1200, glow: true, command: "customability %player% pyroclastic 1"}
          - {material: MONSTER_EGG, name: "&4Reaper's Harvest", description: "Strength II for 6s, but Hunger III.", price: 1300, glow: true, command: "customability %player% reaper 1"}
          - {material: MONSTER_EGG, name: "&5Void Tether", description: "Pull a hit player closer and slow them.", price: 1500, glow: true, command: "customability %player% void 1"}
      - name: "&6&lCustom TNT"
        items:
          - {material: COMMAND_MINECART, name: "&8Poop TNT", description: "Leaves a messy surprise.", price: 600, glow: true, command: "customtnt %player% poop 1"}
          - {material: COMMAND_MINECART, name: "&dFirework TNT", description: "Bursts into a firework show.", price: 800, glow: true, command: "customtnt %player% firework 1"}
          - {material: COMMAND_MINECART, name: "&aSlime TNT", description: "Covers the area in bouncy slime.", price: 1000, glow: true, command: "customtnt %player% slime 1"}
          - {material: COMMAND_MINECART, name: "&bAnti-TNT", description: "Undoes damage from other custom TNT.", price: 1200, glow: true, command: "customtnt %player% anti-tnt 1"}
          - {material: COMMAND_MINECART, name: "&cFire TNT", description: "Sets the area ablaze.", price: 1500, glow: true, command: "customtnt %player% fire 1"}
          - {material: COMMAND_MINECART, name: "&drdmTNT", description: "A random explosion every time.", price: 2000, glow: true, command: "customtnt %player% rdm 1"}
          - {material: COMMAND_MINECART, name: "&9X-Ray TNT", description: "Reveals ores in a wide area.", price: 2500, glow: true, command: "customtnt %player% x-ray 1"}
          - {material: COMMAND_MINECART, name: "&7Mining TNT", description: "Digs a mining tunnel where placed.", price: 3000, glow: true, command: "customtnt %player% mining 1"}
          - {material: COMMAND_MINECART, name: "&2Mob TNT", description: "Summons mobs when it blows.", price: 3500, glow: true, command: "customtnt %player% mob 1"}
          - {material: COMMAND_MINECART, name: "&6Sun TNT", description: "Burns bright like a small sun.", price: 4000, glow: true, command: "customtnt %player% sun 1"}
          - {material: COMMAND_MINECART, name: "&4Boss TNT", description: "Calls in a powerful boss.", price: 4500, glow: true, command: "customtnt %player% boss 1"}
          - {material: COMMAND_MINECART, name: "&5Black Hole TNT", description: "Pulls everything into a black hole.", price: 5000, glow: true, command: "customtnt %player% black-hole 1"}
          - {material: COMMAND_MINECART, name: "&4Nuke TNT", description: "A huge, devastating blast.", price: 6000, glow: true, command: "customtnt %player% nuke 1"}
