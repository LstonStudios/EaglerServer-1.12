name: CustomItems
version: 1.0.0
main: net.lstonstudios.customitems.CustomItemsPlugin
author: LstonStudios
description: Adds custom items such as the lightning sword.
commands:
  customsword:
    description: Give custom swords to players.
    usage: /customsword <player|@a|@s|@p> <lightning|explosion|pearl|fall|bad|tp|all> [amount]
    aliases: [csword]
    permission: customitems.admin
permissions:
  customitems.admin:
    description: Allows giving custom items.
    default: op
