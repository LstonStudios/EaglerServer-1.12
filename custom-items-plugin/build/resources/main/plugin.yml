name: CustomItems
version: 1.0.0
main: net.lstonstudios.customitems.CustomItemsPlugin
author: LstonStudios
description: Adds custom items such as the lightning sword.
commands:
  customsword:
    description: Give custom swords to players.
    usage: /customsword <player|@a|@s|@p> <lightning|explosion|pearl|fall|bad|tp|mace|spear|wind|all> [amount]
    aliases: [cweapon]
    permission: customitems.admin
  pass:
    description: Give one-time redstone passes to players.
    usage: /pass <player|@a|@s|@p> [amount]
    permission: customitems.admin
  passbutton:
    description: Give special buttons that require one-time redstone passes.
    usage: /passbutton <player|@a|@s|@p> [amount]
    permission: customitems.admin
permissions:
  customitems.admin:
    description: Allows giving custom items.
    default: op
